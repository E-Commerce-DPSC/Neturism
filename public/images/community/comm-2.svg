<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0A0A0A"/>
  <rect x="5" y="5" width="390" height="390" stroke="#1F1F1F" stroke-width="1"/>
  <!-- Bandana Pattern Base -->
  <rect x="30" y="30" width="340" height="340" stroke="#222222" stroke-width="1" stroke-dasharray="8 8"/>
  <circle cx="200" cy="200" r="130" stroke="#262626" stroke-width="1"/>
  
  <!-- Crucifix Chain Resting in Center -->
  <ellipse cx="200" cy="200" rx="100" ry="70" stroke="#555555" stroke-width="26" fill="none"/>
  <ellipse cx="200" cy="200" rx="100" ry="70" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="16 12" fill="none"/>

  <!-- Center Cross Pendant -->
  <g transform="translate(200, 200)">
    <rect x="-5" y="-35" width="10" height="70" fill="#FFFFFF"/>
    <rect x="-25" y="-15" width="50" height="10" fill="#FFFFFF"/>
  </g>
</svg>
