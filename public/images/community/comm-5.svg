<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0A0A0A"/>
  <rect x="5" y="5" width="390" height="390" stroke="#1F1F1F" stroke-width="1"/>
  
  <!-- Black Graphic T-Shirt Fabric with Printed Sigil -->
  <rect x="20" y="20" width="360" height="360" fill="#111111"/>
  <g transform="translate(180, 180) rotate(15)" opacity="0.35">
    <rect x="-8" y="-90" width="16" height="180" fill="#FFFFFF"/>
    <rect x="-60" y="-30" width="120" height="16" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="50" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  </g>

  <!-- Vertical Heavy Chunky Chain Overlay -->
  <path d="M220,-20 L200,420" stroke="#666666" stroke-width="32" stroke-linecap="square"/>
  <path d="M220,-20 L200,420" stroke="#DDDDDD" stroke-width="20" stroke-linecap="square" stroke-dasharray="24 16"/>
  <path d="M220,-20 L200,420" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" stroke-dasharray="8 32"/>
</svg>
