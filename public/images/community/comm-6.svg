<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#0A0A0A"/>
  <rect x="5" y="5" width="390" height="390" stroke="#1F1F1F" stroke-width="1"/>
  
  <!-- Central Emblem Print -->
  <g transform="translate(200, 190) scale(4.5)">
    <!-- Central Crucifix -->
    <rect x="-2" y="-20" width="4" height="40" fill="#FFFFFF"/>
    <rect x="-14" y="-10" width="28" height="4" fill="#FFFFFF"/>
    <!-- Wing Barbs Left -->
    <path d="M-2,-14 L-10,-18 L-8,-12 L-16,-14 L-12,-8 L-20,-8 L-14,-4 L-20,0 L-12,0 L-18,6 L-8,4 L-12,12 L-2,6 Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <!-- Wing Barbs Right -->
    <path d="M2,-14 L10,-18 L8,-12 L16,-14 L12,-8 L20,-8 L14,-4 L20,0 L12,0 L18,6 L8,4 L12,12 L2,6 Z" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Typography Frame -->
  <text x="50" y="340" fill="#888888" font-family="monospace" font-size="11" letter-spacing="3">NETURISM GOTHIC CROSS</text>
  <text x="50" y="360" fill="#555555" font-family="monospace" font-size="9" letter-spacing="2">EMBLEM GRAPHIC PRINT // ARCHIVE</text>
</svg>
