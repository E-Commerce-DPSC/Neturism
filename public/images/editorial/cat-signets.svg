<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="750" fill="#0C0C0C"/>
  <rect x="10" y="10" width="580" height="730" stroke="#222222" stroke-width="1"/>
  
  <circle cx="300" cy="360" r="280" fill="#1A1A1A" opacity="0.6"/>

  <!-- Hand with 4 Curved Fingers Extended -->
  <g transform="translate(100, 160)">
    <!-- Palm base -->
    <path d="M50,380 C100,340 180,330 260,360 C320,380 340,480 300,540 L100,540 Z" fill="#222222"/>

    <!-- Index Finger -->
    <path d="M80,340 C90,260 100,180 120,120 C130,80 160,80 160,130 C160,190 150,270 150,330 Z" fill="#2D2D2D"/>
    <!-- Middle Finger -->
    <path d="M160,330 C170,230 180,140 200,60 C210,20 240,20 240,70 C240,150 230,240 230,330 Z" fill="#333333"/>
    <!-- Ring Finger -->
    <path d="M230,330 C240,240 250,160 270,90 C280,50 310,50 310,100 C310,170 300,250 290,340 Z" fill="#2A2A2A"/>
    <!-- Pinky Finger -->
    <path d="M290,340 C300,270 310,200 330,150 C340,120 370,120 360,160 C350,220 340,280 330,360 Z" fill="#252525"/>

    <!-- Signet Rings on Fingers -->
    <!-- Ring on Index -->
    <rect x="100" y="210" width="58" height="40" fill="#141414" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="110" y="215" width="38" height="30" fill="#000000" stroke="#777777" stroke-width="1"/>
    <polygon points="129,220 137,230 129,240 121,230" fill="#FFFFFF"/>

    <!-- Ring on Middle -->
    <rect x="175" y="180" width="60" height="45" fill="#141414" stroke="#E5E5E5" stroke-width="3"/>
    <rect x="185" y="186" width="40" height="33" fill="#000000"/>
    <line x1="185" y1="202" x2="225" y2="202" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="205" y1="186" x2="205" y2="219" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Ring on Ring Finger -->
    <rect x="245" y="200" width="60" height="38" fill="#141414" stroke="#CCCCCC" stroke-width="2"/>
    <polygon points="255,206 295,206 285,232 265,232" fill="#FFFFFF"/>

    <!-- Ring on Pinky -->
    <rect x="305" y="240" width="50" height="34" fill="#141414" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="330" cy="257" r="10" fill="#2A2A2A" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Dark Vignette Gradient -->
  <rect width="600" height="750" fill="url(#bottomGrad2)"/>
  <defs>
    <linearGradient id="bottomGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
</svg>
