<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <g transform="translate(300, 300)">
    <!-- Double Parallel Chunky Chains -->
    <path d="M-180,40 C -180,-120, 180,-120, 180,40" stroke="#333333" stroke-width="26" stroke-linecap="square"/>
    <path d="M-180,40 C -180,-120, 180,-120, 180,40" stroke="#777777" stroke-width="16" stroke-linecap="square" stroke-dasharray="14 10"/>
    
    <path d="M-150,80 C -150,-80, 150,-80, 150,80" stroke="#222222" stroke-width="20" stroke-linecap="square"/>
    <path d="M-150,80 C -150,-80, 150,-80, 150,80" stroke="#666666" stroke-width="12" stroke-linecap="square" stroke-dasharray="12 8"/>

    <!-- Claw Clasp in center foreground -->
    <polygon points="-40,110 -60,60 -20,60" fill="#FFFFFF"/>
    <polygon points="40,110 60,60 20,60" fill="#FFFFFF"/>
    <rect x="-30" y="40" width="60" height="24" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // DOUBLE CLAW</text>
  <text x="480" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">GUNMETAL PVD</text>
</svg>
