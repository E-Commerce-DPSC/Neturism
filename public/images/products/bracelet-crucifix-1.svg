<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <!-- Subtle Industrial Grid Background -->
  <line x1="100" y1="20" x2="100" y2="580" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="20" x2="500" y2="580" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="100" x2="580" y2="100" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="500" x2="580" y2="500" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Chain Links Arc -->
  <path d="M120 320 C 120 180, 480 180, 480 320" stroke="#555555" stroke-width="22" stroke-linecap="square"/>
  <path d="M120 320 C 120 180, 480 180, 480 320" stroke="#888888" stroke-width="16" stroke-linecap="square" stroke-dasharray="14 10"/>
  <path d="M120 320 C 120 180, 480 180, 480 320" stroke="#CCCCCC" stroke-width="4" stroke-dasharray="8 16"/>

  <!-- Barbed Links Details -->
  <polygon points="200,220 220,195 240,225" fill="#EEEEEE"/>
  <polygon points="360,220 380,195 400,225" fill="#EEEEEE"/>
  <polygon points="140,280 120,260 150,260" fill="#EEEEEE"/>
  <polygon points="460,280 480,260 450,260" fill="#EEEEEE"/>

  <!-- Center Suspended Heavy Crucifix -->
  <g transform="translate(300, 360)">
    <!-- Shadow -->
    <rect x="-10" y="-70" width="20" height="150" fill="#000000" opacity="0.6"/>
    <rect x="-55" y="-30" width="110" height="20" fill="#000000" opacity="0.6"/>
    
    <!-- Cross Body -->
    <rect x="-8" y="-75" width="16" height="150" fill="#D4D4D4" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-50" y="-35" width="100" height="16" fill="#D4D4D4" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Spikes / Barbs on Cross -->
    <polygon points="-8,-45 -22,-45 -8,-35" fill="#FFFFFF"/>
    <polygon points="8,-45 22,-45 8,-35" fill="#FFFFFF"/>
    <polygon points="-8,45 -22,45 -8,35" fill="#FFFFFF"/>
    <polygon points="8,45 22,45 8,35" fill="#FFFFFF"/>

    <!-- Center Ring Connector -->
    <circle cx="0" cy="-75" r="12" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <circle cx="0" cy="-27" r="6" fill="#111111" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Tag Stamped in Corner -->
  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // ARCHIVE PIECE 01</text>
  <text x="470" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">STAINLESS 316L</text>
</svg>
