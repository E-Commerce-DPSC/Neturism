<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0A0A0A"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <!-- Macro Close Up Detail on Box Clasp -->
  <g transform="translate(300, 300)">
    <rect x="-120" y="-80" width="240" height="160" fill="#141414" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-100" y="-60" width="200" height="120" fill="#000000" stroke="#444444" stroke-width="1"/>
    
    <!-- Engraved Neturism Emblem in Center of Clasp -->
    <rect x="-4" y="-35" width="8" height="70" fill="#FFFFFF"/>
    <rect x="-24" y="-15" width="48" height="8" fill="#FFFFFF"/>
    <polygon points="-4,-15 -20,-30 -4,-5" fill="#FFFFFF"/>
    <polygon points="4,-15 20,-30 4,-5" fill="#FFFFFF"/>
    
    <!-- Release Trigger Lever -->
    <rect x="120" y="-30" width="25" height="60" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="132" cy="0" r="5" fill="#000000"/>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // DETAIL: CLASP MECHANISM</text>
  <text x="490" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">MACRO VIEW</text>
</svg>
