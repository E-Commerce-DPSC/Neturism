  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <!-- Flat Lay Style View -->
  <g transform="translate(300, 300) rotate(45)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#444444" stroke-width="32"/>
