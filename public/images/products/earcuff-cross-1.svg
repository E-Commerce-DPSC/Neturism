<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <g transform="translate(300, 280)">
    <!-- Ear Cuff Band C-Shape -->
    <path d="M-50,-80 C -120,-80, -120,60, -50,60" fill="none" stroke="#444444" stroke-width="28" stroke-linecap="square"/>
    <path d="M-50,-80 C -120,-80, -120,60, -50,60" fill="none" stroke="#888888" stroke-width="18" stroke-linecap="square"/>
    <path d="M-50,-80 C -120,-80, -120,60, -50,60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/>

    <!-- Small connecting chain -->
    <line x1="-50" y1="60" x2="-20" y2="120" stroke="#AAAAAA" stroke-width="6" stroke-dasharray="6 6"/>
    
    <!-- Dangling Mini Cross -->
    <g transform="translate(-20, 150)">
      <rect x="-6" y="-30" width="12" height="70" fill="#E5E5E5" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="-22" y="-12" width="44" height="12" fill="#E5E5E5" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // CROSS EAR CUFF</text>
  <text x="470" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">CLIP-ON // NO PIERCE</text>
</svg>
