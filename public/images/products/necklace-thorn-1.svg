<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <!-- Subtle Industrial Grid Background -->
  <line x1="300" y1="20" x2="300" y2="580" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="300" x2="580" y2="300" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Heavy Thorn Necklace Loop -->
  <g transform="translate(300, 260)">
    <path d="M-180,-160 C -180,180, 180,180, 180,-160" stroke="#444444" stroke-width="26" stroke-linecap="square"/>
    <path d="M-180,-160 C -180,180, 180,180, 180,-160" stroke="#888888" stroke-width="16" stroke-linecap="square" stroke-dasharray="18 12"/>
    <path d="M-180,-160 C -180,180, 180,180, 180,-160" stroke="#DDDDDD" stroke-width="4" stroke-dasharray="6 24"/>

    <!-- Thorn Spikes radiating around the lower curve -->
    <polygon points="-120,60 -150,75 -125,85" fill="#FFFFFF"/>
    <polygon points="-80,110 -105,135 -75,130" fill="#FFFFFF"/>
    <polygon points="-30,135 -40,170 -15,150" fill="#FFFFFF"/>
    <polygon points="30,135 40,170 15,150" fill="#FFFFFF"/>
    <polygon points="80,110 105,135 75,130" fill="#FFFFFF"/>
    <polygon points="120,60 150,75 125,85" fill="#FFFFFF"/>

    <!-- Center Pendant Spike -->
    <polygon points="-12,145 0,230 12,145" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <circle cx="0" cy="145" r="8" fill="#111111" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // THORN CHAIN</text>
  <text x="490" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">HEAVY LINK 316L</text>
</svg>
