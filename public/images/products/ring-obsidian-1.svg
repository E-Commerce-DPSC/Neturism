<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <!-- Subtle Industrial Grid Background -->
  <line x1="300" y1="20" x2="300" y2="580" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="300" x2="580" y2="300" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Massive Signet Ring Isometric Front -->
  <g transform="translate(300, 290)">
    <!-- Outer Ring Band -->
    <ellipse cx="0" cy="50" rx="140" ry="110" fill="none" stroke="#333333" stroke-width="38"/>
    <ellipse cx="0" cy="50" rx="140" ry="110" fill="none" stroke="#777777" stroke-width="26"/>
    <ellipse cx="0" cy="50" rx="140" ry="110" fill="none" stroke="#D0D0D0" stroke-width="6"/>

    <!-- Signet Flat Top Face -->
    <polygon points="-85,-90 85,-90 110,-20 -110,-20" fill="#141414" stroke="#FFFFFF" stroke-width="3"/>
    <polygon points="-75,-82 75,-82 98,-28 -98,-28" fill="#080808" stroke="#555555" stroke-width="1"/>
    
    <!-- Engraved Gothic Sigil Cross On Face -->
    <rect x="-6" y="-76" width="12" height="46" fill="#E5E5E5"/>
    <rect x="-24" y="-62" width="48" height="10" fill="#E5E5E5"/>
    <!-- Cross diamond tips -->
    <polygon points="0,-82 -8,-76 8,-76" fill="#FFFFFF"/>
    <polygon points="0,-24 -8,-30 8,-30" fill="#FFFFFF"/>
    <polygon points="-28,-57 -24,-62 -24,-52" fill="#FFFFFF"/>
    <polygon points="28,-57 24,-62 24,-52" fill="#FFFFFF"/>

    <!-- Side Carved Barbed Notches -->
    <line x1="-120" y1="-10" x2="-95" y2="35" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-105" y1="10" x2="-85" y2="55" stroke="#888888" stroke-width="3"/>
    <line x1="120" y1="-10" x2="95" y2="35" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="105" y1="10" x2="85" y2="55" stroke="#888888" stroke-width="3"/>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // OBSIDIAN SIGNET</text>
  <text x="490" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">OXIDIZED STEEL</text>
</svg>
