<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="560" height="560" stroke="#222222" stroke-width="1"/>
  
  <g transform="translate(300, 300)">
    <!-- Cylinder Ring Band Profile -->
    <ellipse cx="0" cy="0" rx="130" ry="85" fill="none" stroke="#2B2B2B" stroke-width="40"/>
    <ellipse cx="0" cy="0" rx="130" ry="85" fill="none" stroke="#666666" stroke-width="26"/>
    <ellipse cx="0" cy="0" rx="130" ry="85" fill="none" stroke="#CCCCCC" stroke-width="6"/>

    <!-- Barbed spikes carved around outer perimeter -->
    <polygon points="-110,-55 -135,-75 -100,-70" fill="#FFFFFF"/>
    <polygon points="-40,-85 -55,-115 -25,-100" fill="#FFFFFF"/>
    <polygon points="40,-85 25,-100 55,-115" fill="#FFFFFF"/>
    <polygon points="110,-55 100,-70 135,-75" fill="#FFFFFF"/>
    <polygon points="-120,40 -150,55 -115,65" fill="#FFFFFF"/>
    <polygon points="-60,75 -75,105 -45,95" fill="#FFFFFF"/>
    <polygon points="60,75 45,95 75,105" fill="#FFFFFF"/>
    <polygon points="120,40 115,65 150,55" fill="#FFFFFF"/>
  </g>

  <text x="40" y="550" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">NETURISM // SOVEREIGN BARB</text>
  <text x="490" y="550" fill="#888888" font-family="monospace" font-size="12" letter-spacing="1">MIRROR POLISH</text>
</svg>
